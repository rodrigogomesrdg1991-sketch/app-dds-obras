<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDS CCB | Segurança e Brigada</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DDS CCB">
    <link rel="apple-touch-icon" href="brigada-icon.png">

    <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        input, textarea, select { font-size: 16px !important; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-28 select-none">

    <!-- Cabeçalho com os dois logotipos e tema unificado -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-20 border-b border-slate-800 pt-safe">
        <div class="max-w-lg mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Logotipo CCB (Esquerda) -->
            <div class="flex items-center bg-white px-2 py-1 rounded-lg shadow-sm">
                <img src="ccb-logo.png" alt="Logo CCB" class="h-7 w-auto object-contain">
            </div>

            <!-- Título Central -->
            <div class="text-center">
                <h1 class="text-sm font-bold leading-tight tracking-wide text-slate-100">DDS CCB</h1>
                <p class="text-[10px] text-slate-400 font-medium">Segurança & Brigada</p>
            </div>

            <!-- Logotipo Brigada de Emergência (Direita) + Botão Histórico -->
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-full overflow-hidden shadow-sm bg-white flex items-center justify-center">
    <img src="brigada-logo.png" alt="Logo Brigada" class="w-full h-full object-cover">
</div>
                <button type="button" onclick="carregarHistorico()" class="bg-slate-800 active:bg-slate-700 text-xs font-semibold px-2.5 py-2 rounded-xl text-slate-200 border border-slate-700 transition">
                    Histórico
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-3.5 pt-4 space-y-4">
        
        <!-- Banner de Instalação PWA -->
        <div id="bannerInstalar" class="hidden bg-slate-900 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between gap-3 border border-slate-800">
            <div class="text-xs">
                <p class="font-bold text-amber-400">Instalar App no Celular</p>
                <p class="text-slate-300 mt-0.5">Acesse rápido direto da tela inicial na obra.</p>
            </div>
            <button type="button" id="btnInstalarApp" class="bg-amber-500 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl shrink-0">
                Instalar
            </button>
        </div>

        <!-- Seção de Histórico -->
        <section id="secaoHistorico" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5 mb-3">
                <h2 class="text-base font-bold text-slate-800">Últimos DDS Salvos</h2>
                <button type="button" onclick="document.getElementById('secaoHistorico').classList.add('hidden')" class="text-xs font-semibold text-slate-600 px-2 py-1">Fechar</button>
            </div>
            <div id="listaHistorico" class="space-y-2.5 text-sm"></div>
        </section>

        <!-- Formulário Principal -->
        <form id="ddsForm" class="space-y-4">
            
            <!-- Card 1: Dados da Visita -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3.5">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">1. Dados da Visita</h2>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Data e Hora *</label>
                    <input type="datetime-local" id="dataHora" required
                        class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Local da Obra / Setor *</label>
                    <input type="text" id="obraSetor" placeholder="Ex: Obra Alpha - Bloco B" required
                        class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tema Abordado no DDS *</label>
                    <input type="text" id="tema" placeholder="Ex: Trabalho em altura (NR-35)" required
                        class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Responsável / Técnico *</label>
                    <input type="text" id="responsavel" placeholder="Seu nome" required
                        class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Observações / Ocorrências</label>
                    <textarea id="observacoes" rows="3" placeholder="Recomendações, pontos críticos ou ações..."
                        class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none"></textarea>
                </div>
            </div>

            <!-- Card 2: Lista de Colaboradores -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">2. Colaboradores</h2>
                    <span id="contadorParticipantes" class="text-xs font-bold bg-slate-200 text-slate-800 px-2.5 py-0.5 rounded-full">0 presentes</span>
                </div>
                
                <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200/70">
                    <input type="text" id="novoParticipanteNome" placeholder="Nome completo do colaborador"
                        class="w-full p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                    
                    <input type="text" id="novoParticipanteFuncao" placeholder="Função (Ex: Pedreiro)"
                        class="w-full p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">

                    <!-- Seletor de Tipo de Documento + Número do Documento -->
                    <div class="grid grid-cols-3 gap-2">
                        <select id="novoParticipanteTipoDoc" class="p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none text-xs font-bold text-slate-700">
                            <option value="CPF">CPF</option>
                            <option value="RG">RG</option>
                            <option value="NIE">NIE</option>
                            <option value="DNI">DNI</option>
                            <option value="TIE">TIE</option>
                            <option value="PASSAPORTE">PASSAPORTE</option>
                        </select>
                        <input type="text" id="novoParticipanteNumDoc" placeholder="N.º do Documento"
                            class="col-span-2 p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                    </div>

                    <!-- N.º Adesão + Botão Adicionar -->
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" id="novoParticipanteAdesao" placeholder="N.º Adesão"
                            class="col-span-2 p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-slate-700 focus:outline-none">
                        
                        <button type="button" onclick="adicionarParticipante()"
                            class="col-span-1 bg-slate-800 active:bg-slate-950 text-white font-bold py-3 px-1 rounded-xl text-xs shadow-sm transition flex items-center justify-center">
                            + Adicionar
                        </button>
                    </div>
                </div>

                <!-- Lista Dinâmica -->
                <ul id="listaParticipantesUI" class="space-y-2"></ul>
            </div>
                <!-- Lista Dinâmica -->
                <ul id="listaParticipantesUI" class="space-y-2"></ul>
            </div>

            <!-- Barra Fixa Inferior de Ações Rápidas -->
            <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 z-20">
                <div class="max-w-lg mx-auto grid grid-cols-3 gap-2">
                    <button type="submit" id="btnSalvar"
                        class="bg-slate-800 active:bg-slate-700 text-white font-bold py-3 px-2 rounded-xl shadow-sm text-xs border border-slate-700 flex flex-col items-center justify-center gap-0.5">
                        <span>💾 Salvar</span>
                    </button>

                    <button type="button" onclick="gerarPDF()"
                        class="bg-red-700 active:bg-red-800 text-white font-bold py-3 px-2 rounded-xl shadow-sm text-xs flex flex-col items-center justify-center gap-0.5">
                        <span>📄 PDF</span>
                    </button>

    <button class="btn btn-outline-whats">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12.031 2c-5.516 0-9.969 4.453-9.969 9.969 0 1.758.458 3.475 1.328 4.991L2 22l5.188-1.359a9.914 9.914 0 0 0 4.843 1.258h.004c5.515 0 9.968-4.453 9.968-9.969 0-2.663-1.037-5.166-2.92-7.049A9.903 9.903 0 0 0 12.031 2zm5.822 14.234c-.245.691-1.425 1.322-1.979 1.404-.508.075-1.15.107-1.855-.117-.428-.136-.977-.318-1.678-.621-2.946-1.272-4.87-4.242-5.017-4.438-.147-.196-1.198-1.594-1.198-3.041 0-1.447.758-2.158 1.027-2.452.27-.294.588-.368.784-.368.196 0 .392.002.564.01.181.009.423-.069.662.505.245.588.833 2.035.906 2.182.074.147.123.319.025.515-.098.196-.147.319-.294.49-.147.172-.309.383-.441.515-.147.147-.3.306-.129.6.172.294.762 1.257 1.636 2.036 1.124 1.002 2.072 1.313 2.366 1.46.294.147.466.123.638-.074.172-.196.735-.858.931-1.152.196-.294.392-.245.662-.147.27.098 1.716.809 2.01.956.294.147.49.221.564.343.073.123.073.711-.172 1.402z"/>
  </svg>
  WhatsApp
</button>
                </div>
            </div>

        </form>
    </main>

    <script src="app.js"></script>
    <script>
        let deferredPrompt;
        const bannerInstalar = document.getElementById('bannerInstalar');
        const btnInstalar = document.getElementById('btnInstalarApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            bannerInstalar.classList.remove('hidden');
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    bannerInstalar.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
