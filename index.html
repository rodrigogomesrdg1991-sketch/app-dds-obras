<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DDS Campo | Registro de Segurança</title>
    <!-- Tailwind CSS via CDN para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas para geração de PDF no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-12">

    <!-- Cabeçalho Fixo -->
    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">DDS Campo</h1>
                <p class="text-xs text-amber-100">Diálogo Diário de Segurança</p>
            </div>
            <button onclick="carregarHistorico()" class="bg-amber-700 hover:bg-amber-800 text-xs font-semibold px-3 py-2 rounded-lg transition">
                Histórico
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- Formulário Principal -->
        <form id="ddsForm" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">Novo Registro de DDS</h2>

            <!-- Data e Hora -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Data e Hora da Visita *</label>
                <input type="datetime-local" id="dataHora" required
                    class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Local da Obra / Setor -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Local da Obra / Setor *</label>
                <input type="text" id="obraSetor" placeholder="Ex: Residencial Alpha - Bloco B / Fundação" required
                    class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Tema Abordado -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tema Abordado no DDS *</label>
                <input type="text" id="tema" placeholder="Ex: Uso correto de EPIs em trabalho em altura (NR-35)" required
                    class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Responsável / Técnico -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Responsável / Técnico de Segurança *</label>
                <input type="text" id="responsavel" placeholder="Seu nome completo" required
                    class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Observações -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Observações, Ocorrências ou Recomendações</label>
                <textarea id="observacoes" rows="3" placeholder="Descreva pontos críticos observados, dúvidas da equipe ou ações corretivas..."
                    class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
            </div>

            <!-- Lista de Participantes -->
            <div class="pt-2 border-t border-slate-200">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Colaboradores Participantes</label>
                
                <div class="flex gap-2 mb-3">
                    <input type="text" id="novoParticipanteNome" placeholder="Nome do colaborador"
                        class="flex-1 p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input type="text" id="novoParticipanteFuncao" placeholder="Função (Ex: Pedreiro)"
                        class="w-1/3 p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button type="button" onclick="adicionarParticipante()"
                        class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 rounded-lg text-lg transition">
                        +
                    </button>
                </div>

                <!-- Lista Dinâmica -->
                <ul id="listaParticipantesUI" class="space-y-2 text-sm">
                    <!-- Itens inseridos via JS -->
                </ul>
                <p id="contadorParticipantes" class="text-xs text-slate-500 mt-2">0 participantes registrados.</p>
            </div>

            <!-- Botões de Ação -->
            <div class="pt-4 space-y-3">
                <button type="submit" id="btnSalvar"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-4 rounded-xl shadow transition flex justify-center items-center gap-2">
                    <span>Salvar Registro no Banco</span>
                </button>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="gerarPDF()"
                        class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                        Baixar PDF Formal
                    </button>
                    <button type="button" onclick="compartilharWhatsApp()"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                        Enviar WhatsApp
                    </button>
                </div>
            </div>
        </form>

        <!-- Seção de Histórico (Supabase) -->
        <section id="secaoHistorico" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center border-b pb-2 mb-4">
                <h2 class="text-lg font-bold text-slate-700">Últimos Registros Salvos</h2>
                <button onclick="document.getElementById('secaoHistorico').classList.add('hidden')" class="text-xs text-slate-500 underline">Fechar</button>
            </div>
            <div id="listaHistorico" class="space-y-3 text-sm">
                <p class="text-slate-500">Carregando...</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
